name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -r requirements.txt

    - name: Lint Python files
      run: |
        flake8 app.py train_model.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app.py train_model.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Train and evaluate ML model
      run: python train_model.py

    - name: Verify model artifacts and Flask import
      run: |
        test -f models/model.pkl
        test -f models/vectorizer.pkl
        test -f models/metrics.json
        python -c "import app; assert app.model is not None and app.vectorizer is not None; print('Flask ML artifacts loaded successfully')"

    - name: Test with pytest
      run: pytest
